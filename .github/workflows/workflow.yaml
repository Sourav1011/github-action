name: PR Workflow

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "Hello from workflow"

  say-bye:
    runs-on: ubuntu-latest

    steps:
      - name: Say Bye
        run: echo "Bye from workflow"